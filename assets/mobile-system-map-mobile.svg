<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 276" width="320" height="276" role="img" aria-labelledby="title desc">
  <title id="title">GuideMePa mobile and backend architecture</title>
  <desc id="desc">Android and iOS share a Kotlin Multiplatform core connected to a Kotlin Spring Boot backend and configured AI providers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7bd0ff" stroke-width="1.5"/></marker></defs>
  <g font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#d3e4fe">
    <rect x="16" y="8" width="120" height="46" rx="6" fill="#102034" stroke="#45464d"/><text x="76" y="37">Android</text>
    <rect x="184" y="8" width="120" height="46" rx="6" fill="#102034" stroke="#45464d"/><text x="244" y="37">iOS</text>
    <path d="M76 54v18h84m84-18v18h-84v16" fill="none" stroke="#7bd0ff" marker-end="url(#arrow)"/>
    <rect x="16" y="92" width="288" height="62" rx="6" fill="#102034" stroke="#7bd0ff"/><text x="160" y="118">Kotlin Multiplatform</text><text x="160" y="141" fill="#a3acba" font-size="14">Shared camera and chat logic</text>
    <path d="M160 154v24" fill="none" stroke="#7bd0ff" marker-end="url(#arrow)"/>
    <rect x="16" y="182" width="288" height="46" rx="6" fill="#102034" stroke="#45464d"/><text x="160" y="211">Kotlin + Spring Boot</text>
    <path d="M160 228v22" fill="none" stroke="#a4d64c" marker-end="url(#arrow)"/>
    <text x="160" y="270" fill="#a4d64c" font-size="16">Configured AI providers</text>
  </g>
</svg>
